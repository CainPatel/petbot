# petbot configuration.
#
# Copy to vision/config.yaml and fill in for your room and hardware.
# config.yaml is gitignored; this example file is tracked.

camera:
  # Sensor output size. Larger is slower; 1280x720 is a reasonable compromise
  # on a Pi 5 with yolov8n.
  width: 1280
  height: 720

  # MANUAL FOCUS. The room is fixed, so autofocus only introduces hunting and
  # frame-to-frame variation that invalidates the homography.
  #
  # lens_position is in DIOPTRES: 1 / (focus distance in metres).
  #   0.0  = infinity
  #   0.5  = 2 m
  #   1.0  = 1 m
  #   2.0  = 0.5 m
  # Measure the camera-to-floor distance and set 1/d, then fine-tune by eye.
  lens_position: 0.5

  # Set once the camera is mounted; used only for logging.
  mount_height_mm: 2400

detection:
  # yolov8n is the smallest and fastest; step up to yolov8s if recall on
  # curled/sleeping pets is poor. Record which one produced the numbers in
  # docs/results.md.
  model: yolov8n.pt

  confidence: 0.4

  # COCO class IDs. 15 = cat, 16 = dog.
  classes: [15, 16]

  # Where detect.py writes the annotated frame.
  output_image: latest.jpg

serial:
  # Arduino Uno on a Pi is usually /dev/ttyACM0. A CH340 clone appears as
  # /dev/ttyUSB0. Check with: ls -l /dev/serial/by-id/
  port: /dev/ttyACM0
  baud: 115200
  timeout_s: 2.0

  # Seconds to allow for a blocking move to finish before giving up.
  move_timeout_s: 60.0

esp32:
  # esp32/esp32_claw.cpp sets a static IP; keep this and platformio.ini's
  # upload_port in step with it.
  base_url: http://192.168.1.119

  request_timeout_s: 5.0

  # What control/mission.py calls to drop a treat. With the claw that is
  # "open the jaws".
  dispense_endpoint: /release

calibration:
  homography: data/calibration/homography.npy

room:
  # Origin is the floor corner under winch 3 (below the ArduCam); X and Y run
  # along the two walls, Z is up. All millimetres. Pulley exit points at
  # 2794 mm; winches on the floor directly below their pulleys.
  x_mm: 3632
  y_mm: 4343
  z_mm: 2794

# Anchor coordinates: the point where the line LEAVES THE PULLEY SHEAVE.
# Numbered as the firmware numbers winches. These MUST match A[4][3] in
# firmware/uno_winches.cpp. See docs/calibration.md section 2.
anchors:
  a1: [3632, 4343, 2794]   # winch 1, by the door
  a2: [3632,    0, 2794]   # winch 2
  a3: [   0,    0, 2794]   # winch 3, origin corner
  a4: [   0, 4343, 2794]   # winch 4

# Safe box the host clamps every target into. The firmware's inWorkspace()
# in firmware/uno_winches.cpp only WARNS on a target outside its own box and
# then moves anyway, so this clamp is the real guard. Measured edge: the
# winch 2 cable went slack at y ≈ 3494 mm.
#
# z_max is 2400 here, not the firmware's 2300: the park waypoint at z 2400
# was verified taut in the demo. Expect the firmware's WARN line on that
# move; it is harmless. Raise the firmware bound if that gets annoying.
workspace:
  x_min: 400
  x_max: 3200
  y_min: 500
  y_max: 3800
  z_min: 300
  z_max: 2400

# Named positions for control.py. z is the cable attachment plane; the claw
# hangs claw_drop_mm below it. All verified taut in the demo.
waypoints:
  park:  [1500, 1750, 2400]
  bowl:  [1500, 1750, 1800]
  crate: [2400, 2200, 1600]

platform:
  # Height control/mission.py flies at when chasing a detection, mm.
  cruise_z_mm: 1800

  # Seconds to let the platform stop swinging before working the claw.
  settle_s: 1.5

  # Claw jaws sit this far below the cable attachment plane.
  claw_drop_mm: 140

  # ArUco marker on the platform's flat top (vision/track_platform.py).
  aruco_dict: DICT_4X4_50
  aruco_id: 4
