; PlatformIO project for both microcontrollers.
;
;   pio run -e uno -t upload                 Arduino Uno over USB
;   pio run -e esp32_usb -t upload           ESP32 first flash, over USB
;   pio run -e esp32 -t upload               ESP32 over-the-air (once on WiFi)
;   pio device monitor -e uno                serial console, 115200
;
; Sources live next to their docs rather than in src/, so src_dir is the repo
; root and each env picks its single file with build_src_filter.

[platformio]
default_envs = uno, esp32
src_dir = .
; platformio.local.ini is gitignored and carries the OTA password
; (copy platformio.local.example.ini). PlatformIO merges it over this file.
extra_configs = platformio.local.ini

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
build_src_filter = +<firmware/uno_winches.cpp>

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    olikraus/U8g2
build_src_filter = +<esp32/esp32_claw.cpp>

; First flash, or recovery when OTA is unreachable.
[env:esp32_usb]
extends = esp32_common

; Normal reflash: ArduinoOTA on the static IP set in esp32/esp32_claw.cpp.
[env:esp32]
extends = esp32_common
upload_protocol = espota
upload_port = 192.168.1.119
; --auth=<password> is added by platformio.local.ini
upload_flags =
    --timeout=30
